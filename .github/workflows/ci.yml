name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Source lint
        run: npm run lint
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Type check
        run: npm run type-check
      - name: Build
        run: BACKEND_PORT=3001 BASE_PATH=/ npm run build
